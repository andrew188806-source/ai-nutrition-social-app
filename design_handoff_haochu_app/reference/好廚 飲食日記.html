<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>豪食友 · 飲食日記</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Baloo+2:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #FBF3EC; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  @keyframes kc-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes kc-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes kc-spin { to { transform: rotate(360deg); } }
  @keyframes kc-pop { from { opacity: 0; transform: scale(.96) translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes kc-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes kc-cheer { 0% { transform: scale(.7); opacity: 0; } 60% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
  .kc-spin { animation: kc-spin .8s linear infinite; }
  .kc-pop { animation: kc-pop .32s cubic-bezier(.22,1,.36,1) both; }
  .kc-bob { animation: kc-bob 3.4s ease-in-out infinite; }
  .kc-cheer { animation: kc-cheer .5s cubic-bezier(.34,1.4,.5,1) both; }
  button { font-family: inherit; transition: transform .12s ease; }
  button:active { transform: scale(.98); }
  @media (prefers-reduced-motion: reduce) { .kc-bob, .kc-cheer { animation: none !important; } button { transition: none; } }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
